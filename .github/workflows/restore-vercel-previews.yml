name: Restore Vercel PR previews

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-vercel-previews
  cancel-in-progress: false

jobs:
  connect:
    if: github.repository == 'namastack/namastack-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify preview configuration and existing project
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          config = json.loads(Path('vercel.json').read_text())
          assert config['git']['deploymentEnabled'] == {'main': False}, 'Automatic production deployment must be disabled first'
          project_id = os.environ['VERCEL_PROJECT_ID']
          team_id = os.environ['VERCEL_ORG_ID']
          def get(path):
              request = urllib.request.Request('https://api.vercel.com' + path + '?teamId=' + team_id, headers={'Authorization': 'Bearer ' + os.environ['VERCEL_TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          project = get('/v9/projects/' + project_id)
          assert project['name'] == 'namastack-outbox', 'Unexpected project'
          assert project['accountId'] == team_id, 'Unexpected account'
          assert project.get('rootDirectory') in (None, ''), 'Unexpected root directory'
          assert project['nodeVersion'] == '22.x', 'Unexpected Node.js version'
          for key in ('buildCommand', 'installCommand', 'outputDirectory'):
              assert project[key] == config[key], 'Unexpected ' + key
          link = project.get('link')
          if link:
              assert link['type'] == 'github' and str(link['repoId']) == '1456500869', 'Project is linked to another repository'
          domains = get('/v9/projects/' + project_id + '/domains')
          assert any(domain['name'] == 'www.namastack.io' for domain in domains['domains']), 'Production domain missing'
          Path('.vercel').mkdir(exist_ok=True)
          Path('.vercel/project.json').write_text(json.dumps({'orgId': team_id, 'projectId': project_id}))
          print('Verified existing project, root, Node.js, build settings and domain.')
          PY
      - name: Connect website repository for preview deployments
        run: npx --yes vercel@65.15.0 git connect --yes --token="$VERCEL_TOKEN"
      - name: Verify repository link
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.vercel.com/v9/projects/' + os.environ['VERCEL_PROJECT_ID'] + '?teamId=' + os.environ['VERCEL_ORG_ID']
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['VERCEL_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              project = json.load(response)
          link = project['link']
          assert link['type'] == 'github' and str(link['repoId']) == '1456500869', 'Unexpected repository link'
          assert link['productionBranch'] == 'main', 'Unexpected production branch'
          print('Connected namastack/namastack-website with main as the production branch.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Connected the existing Vercel project to `namastack/namastack-website`. Git previews are enabled; production remains managed by the Website workflow.\n')
          PY
